<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面未找到｜红涂大师</title>
  <meta name="description" content="当前地址没有对应页面，可返回红涂大师官网查看工厂视觉与目视化系统服务。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <style>
    /* Hallmark · custom · idea: quiet wayfinding back to the factory service atlas · shape: error · hero: none · nav: named text return action · footer: none · signature: large numeric wayfinding · colors: restrained · fonts: project CJK and Barlow Condensed · imagery: none · sections: single error */
    :root { --ink: #111417; --paper: #f7f6f2; --muted: #a4aaa9; --red: #df6659; --focus: #df6659; --font-body: "PingFang SC", "Microsoft YaHei", sans-serif; --font-num: "Barlow Condensed", sans-serif; }
    @font-face { font-family: "Barlow Condensed"; src: url("assets/css/BarlowCondensed-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 5px; }
    .nf { min-height: 100svh; display: flex; align-items: center; padding: 40px 24px; }
    .nf-inner { width: min(100%, 1040px); margin-inline: auto; }
    .nf-code { margin: 0; color: var(--red); font-family: var(--font-num); font-size: clamp(88px, 16vw, 200px); font-weight: 600; line-height: 0.86; font-variant-numeric: tabular-nums; }
    .nf h1 { margin: 24px 0 0; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
    .nf p:not(.nf-code) { max-width: 560px; margin: 20px 0 0; color: var(--muted); line-height: 1.8; }
    .nf a { display: inline-block; margin-top: 32px; padding: 12px 0; border-bottom: 1px solid var(--red); font-weight: 600; }
    .nf a:active { opacity: 0.72; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <p class="nf-code">404</p>
      <h1>这个地址没有对应页面。</h1>
      <p>返回首页，继续查看红涂大师的系统能力、服务选择、交付保障与项目案例。</p>
      <a href="./">返回红涂大师首页</a>
    </div>
  </main>
</body>
</html>
